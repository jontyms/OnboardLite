[project]
name = "onboardlite"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "commonmark>=0.9.2",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.141.1",
    "google-api-python-client>=2.200.0",
    "google-auth>=2.58.0",
    "jinja2>=3.1.6",
    "joserfc>=1.7.5",
    "passes-rs-py>=4.0.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-keycloak>=7.1.1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "requests-oauthlib>=2.0.0",
    "segno>=1.6.6",
    "sentry-sdk>=2.69.1",
    "sqlmodel>=0.0.42",
    "stripe>=15.6.1",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx",
    "pre-commit",
    "pyrefly>=1.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
    "semgrep",
    "virtualenv",
]

[tool.pyrefly]
project_includes = ["app"]
project_excludes = ["app/migrations", "**/__pycache__", "app/util/kennelish.py", "app/util/google_wallet.py"]
