[project]
name = "onboardlite"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "commonmark>=0.9.1",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.135.3",
    "google-api-python-client>=2.193.0",
    "google-auth>=2.49.2",
    "jinja2>=3.1.6",
    "joserfc>=1.6.3",
    "passes-rs-py>=4.0.2",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "python-keycloak>=7.1.1",
    "pyyaml>=6.0.2",
    "requests>=2.33.0",
    "requests-oauthlib>=2.0.0",
    "segno>=1.6.0",
    "sentry-sdk>=2.57.0",
    "sqlmodel>=0.0.37",
    "stripe>=15.0.1",
    "uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
    "httpx",
    "pre-commit",
    "pyrefly>=1.1",
    "pytest>=8.3.5",
    "ruff>=0.15.19",
    "semgrep",
    "virtualenv",
]

[tool.pyrefly]
project_includes = ["app"]
project_excludes = ["app/migrations", "**/__pycache__", "app/util/kennelish.py", "app/util/google_wallet.py"]
