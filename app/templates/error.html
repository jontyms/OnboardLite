{% extends 'base.html' %}
{% block title %} Error {{code}} - Hack@UCF {% endblock %}
{% block content %}
<body>
    <div class="app" id="1">
        <h1>Error {{code}}</h1>
        <h2>{{reason}}</h2>

        <a class="btn" href="/"><i class="fa-solid fa-house"></i> Go Home</a>

        <h6>{{essay}}</h6>

        {% for label, url, icon in links %}
        <a class="btn" href="{{url}}" target="_blank" rel="noopener"><i class="{{icon}}"></i> {{label}}</a>
        {% endfor %}
    </div>
</body>
<script type="text/javascript" src="/static/form.js"></script>
{% endblock %}
